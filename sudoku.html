<!DOCTYPE html>

<head>
    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('assets/Roboto-Medium.ttf') format('truetype');
        }
    
        @font-face {
            font-family: 'RobotoSlab';
            src: url('assets/RobotoSlab-Medium.ttf') format('truetype');
        }
    </style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'roboto': ['Roboto', 'sans-serif'],
                        'slab': ['RobotoSlab', 'sans-serif'],
                    },
                    colors: {
                        greenfg: '#038C9F',
                        greenbg: '#C6F4E8',
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>

    <script type="module">
        // Load the CSV file using d3.csv
        d3.csv("files/sudoku.csv", d3.autoType).then(gistemp => {
        const plot1 = Plot.plot({
            marks: [
                Plot.ruleY([0], {stroke: "#038C9F"}), // is 0-based, 4->May
                Plot.ruleX([new Date(2024, 4, 25)], {stroke: "#038C9F"}),
                Plot.ruleY([600], {stroke: "#038C9F", strokeDasharray: "5,5"}),
                Plot.dot(gistemp, {x: "Date", y: "Time", stroke: "#038C9F"}),
                Plot.lineY(gistemp,
                          Plot.windowY(5, {x: "Date", y: "Time"}),
                          {stroke: "#038C9F"})
            ]
        });
        const div = document.querySelector("#myplot");
        div.append(plot1);
    }).catch(error => {
        console.error("Error loading the CSV file:", error);
    });
    </script>
</head>
<body class="bg-greenbg font-roboto">
    <p class="mb-4 text-left text-lg text-greenfg md:text-center">
        Since the end of May, I have been doing the daily Sudoku from the NYT. I am tracking the time it takes me to solve the puzzles and hope to update this plot daily.
    </p>
    <p class="mb-4 text-left text-lg text-greenfg md:text-center">
        <b>Disclaimer:</b> I do them in the morning, uncaffeinated.
    </p>
    <div class="w-full h-screen">
        <div id="myplot"></div>
    </div>
</body>
</html>
